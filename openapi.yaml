openapi: 3.1.0
info:
  title: Darugachi — admin API
  version: "1.0.0"
  description: >
    Management API for Darugachi's model registry (model_api.py).
    Writes validated llama-swap model definitions to models.d/ and manages
    background downloads of their weights. Runs on port 9293 by default;
    firewall it to the dev machine. This is separate from the OpenAI-compatible
    inference API llama-swap serves on port 9292.
servers:
  - url: http://LAN-BOX:9293

security:
  - bearerAuth: []

paths:
  /spec:
    get:
      summary: Fetch this OpenAPI spec
      operationId: getSpec
      security: []
      responses:
        "200":
          description: This document, served as-is from disk
          content:
            application/yaml:
              schema:
                type: string

  /self-update:
    post:
      summary: Pull and restart Darugachi
      description: >
        Starts a detached process that waits three seconds, pulls the checkout
        with --ff-only, and starts Darugachi. The current service stops after
        one second. A failed pull still restarts the existing checkout. Output
        is appended to /tmp/darugachi-update.log.
      operationId: updateDarugachi
      responses:
        "202":
          description: Update and restart scheduled
          content:
            application/json:
              schema:
                type: object
                required: [status, restart_in_seconds]
                properties:
                  status:
                    type: string
                    const: updating
                  restart_in_seconds:
                    type: integer
                    const: 3
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: An update is already scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The detached updater could not be started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /models:
    get:
      summary: List model definitions
      operationId: listModels
      responses:
        "200":
          description: Model ids currently defined in models.d/
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items:
                      type: string
              example:
                models: ["hello-reranker", "qwen3-embed-8b-Q4_K_M"]
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Add a model definition
      operationId: createModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModelRequest"
            example:
              id: bge-reranker
              engine: llama-reranker
              model: "Geofront/BGE-Reranker-v2-M3-GGUF:Q4_K_M"
              arguments: ["--ctx-size", "8192"]
      responses:
        "201":
          description: Definition written to models.d/
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelStatusResponse"
              example:
                id: bge-reranker
                status: configured
        "400":
          description: Invalid id, engine, model, or body size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A definition with this id already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /models/{id}:
    delete:
      summary: Remove a model definition
      description: >
        Deletes the definition's yaml (and any download-status tracking).
        llama-swap picks up the removal automatically. Does not stop a
        currently running instance of the model or delete cached weights.
      operationId: deleteModel
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelStatusResponse"
              example:
                id: bge-reranker
                status: deleted
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /models/{id}/download:
    post:
      summary: Register (if new) and download a model's weights in the background
      description: >
        Downloads end-to-end for a given Hugging Face model id: if `id` is
        not already registered, `engine` and `model` must be given in the
        body and are used to create its definition first (equivalent to
        POST /models), then the download starts; if `id` is already
        registered, the body may be omitted and its existing engine/model/
        arguments are reused. Either way this runs `hf download` (scoped to the GGUF
        quant via --include for llama-reranker/llama-embedding) or
        `docker pull` + `hf download` (for vllm-pooling) in a background
        thread and returns immediately. Poll GET /models/{id}/status for
        completion. A first inference request also downloads lazily, but
        llama-swap's health-check timeout can be shorter than a large cold
        download takes, so downloading this way avoids a spurious failed
        request.
      operationId: startModelDownload
      parameters:
        - $ref: "#/components/parameters/ModelId"
      requestBody:
        required: false
        description: Required only when `id` is not already registered.
        content:
          application/json:
            schema:
              type: object
              required: [engine, model]
              properties:
                engine:
                  type: string
                  enum: [llama-reranker, llama-embedding, vllm-pooling]
                model:
                  type: string
                  description: Hugging Face repo id, optionally suffixed with `:QUANT`.
                arguments:
                  $ref: "#/components/schemas/ModelArguments"
            example:
              engine: llama-embedding
              model: "Qwen/Qwen3-Embedding-8B-GGUF:Q4_K_M"
              arguments: ["--pooling", "mean"]
      responses:
        "202":
          description: Download started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelStatusResponse"
              example:
                id: bge-reranker
                status: downloading
        "400":
          description: >
            Invalid id, or id is not registered and the body is missing/invalid
            engine/model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A download for this id is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /models/{id}/status:
    get:
      summary: Get a model's download status
      operationId: getModelDownloadStatus
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "200":
          description: Current download status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadStatus"
              examples:
                not_started:
                  value: { id: bge-reranker, state: not_started }
                downloading:
                  value:
                    id: bge-reranker
                    state: downloading
                    phase: "downloading weights"
                    message: "model.safetensors: 34%|###| 203M/596M [00:12<00:24, 16.1MB/s]"
                    updated_at: "2026-08-30T19:44:47+00:00"
                    seconds_since_update: 1
                ready:
                  value: { id: bge-reranker, state: ready }
                failed:
                  value:
                    id: bge-reranker
                    state: failed
                    message: "hf: repository not found"
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The `ADMIN_API_KEY` value from the box's .env file.

  parameters:
    ModelId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$"

  schemas:
    CreateModelRequest:
      type: object
      required: [id, engine, model]
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$"
        engine:
          type: string
          enum: [llama-reranker, llama-embedding, vllm-pooling]
        model:
          type: string
          description: Hugging Face repo id, optionally suffixed with `:QUANT` (e.g. GGUF quant tag).
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*(?::[A-Za-z0-9][A-Za-z0-9._-]*)?$"
        arguments:
          $ref: "#/components/schemas/ModelArguments"
    ModelArguments:
      type: array
      maxItems: 64
      description: Additional command arguments, stored with the model and safely shell-quoted.
      items:
        type: string
        maxLength: 512
    ModelStatusResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [configured, deleted, downloading]
    DownloadStatus:
      type: object
      required: [id, state]
      properties:
        id:
          type: string
        state:
          type: string
          enum: [not_started, downloading, ready, failed]
        phase:
          type: string
          description: >
            Present while state is "downloading" and the download involves more
            than one step (e.g. "pulling image" then "downloading weights" for
            vllm-pooling).
        message:
          type: string
          description: >
            The most recent output line from the underlying `hf download` /
            `docker pull` process while state is "downloading" (its raw progress
            line, e.g. including a percentage and transfer rate), or the tail of
            its stderr when state is "failed".
        updated_at:
          type: string
          format: date-time
          description: UTC timestamp of the last progress line seen, present while state is "downloading".
        seconds_since_update:
          type: integer
          description: >
            Seconds since `updated_at`, computed at request time. A large or
            growing value while state is "downloading" indicates the download
            has stalled rather than merely being slow.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

  responses:
    Unauthorized:
      description: Missing or incorrect bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such model id
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
